[package]
name = "kaptor_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]
name = "kaptor_native"

[dependencies]
wasmtime = { version = "47", default-features = false, features = ["cranelift", "runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wat = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
