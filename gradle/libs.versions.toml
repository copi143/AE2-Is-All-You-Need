[versions]
java = "17"
kotlin = "2.4.10"
# kotlin-dsl = "6.7.6"
# dokka = "2.2.0"
moddev = "2.0.143"
loom = "1.9-SNAPSHOT"
dokka = "1.9.20"

minecraft = "1.20.1"
minecraftRange = "[1.20.1, 1.20.2)"

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment = "2023.09.03"
parchmentMC = "1.20.1"

forge = "1.20.1-47.3.0"
forgeRange = "[47.1, 48)"
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## For Neo's MDG Legacy Plugin, this is the MCP version (https://files.minecraftforge.net/de/oceanlabs/mcp/mcp_config/index_1.20.1.html)
neoForm = "1.20.1"
kff = "4.12.0"
kffRange = "[4, )"

fabricLoader = "0.16.9"
fabricApi = "0.92.2+1.20.1"
flk = "1.12.3+kotlin.2.0.21"

junit = "5.10.5"
junit-launcher = "1.10.0"
kotlinx-coroutines-core = "1.11.0"
mixin = "0.8.5"
compose = "1.12.0-beta03"

mui-core = "3.12.0"
mui = "1.20.1-3.12.0.1"
ftbq = "2001.4.22"

jei = "15.20.0.115"
emi = "1.1.24+1.20.1"
jade-fabric = "11.13.3+fabric"
jade-forge = "11.13.3+forge"

guideme = "20.1.7"
ae2 = "15.4.10"
gtceu = "7.5.3"
mek = "1.20.1-10.4.16.80"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabricApi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi" }
flk = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "flk" }
kff = { group = "thedarkcolour", name = "kotlinforforge", version.ref = "kff" }

junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlinx-coroutines-core" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui-desktop", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation-desktop", version.ref = "compose" }
compose-foundation-layout = { module = "org.jetbrains.compose.foundation:foundation-layout-desktop", version.ref = "compose" }
compose-animation = { module = "org.jetbrains.compose.animation:animation-desktop", version.ref = "compose" }
compose-material = { module = "org.jetbrains.compose.material:material-desktop", version.ref = "compose" }

mui-core = { module = "icyllis.modernui:ModernUI-Core", version.ref = "mui-core" }
mui = { module = "icyllis.modernui:ModernUI-Forge", version.ref = "mui" }
ftbq = { module = "dev.ftb.mods:ftb-quests-forge", version.ref = "ftbq" }

jei-fabric = { module = "mezz.jei:jei-1.20.1-fabric", version.ref = "jei" }
jei-forge = { module = "mezz.jei:jei-1.20.1-forge", version.ref = "jei" }
emi-fabric = { module = "dev.emi:emi-fabric", version.ref = "emi" }
emi-forge = { module = "dev.emi:emi-forge", version.ref = "emi" }
jade-fabric = { module = "maven.modrinth:jade", version.ref = "jade-fabric" }
jade-forge = { module = "maven.modrinth:jade", version.ref = "jade-forge" }

guideme = { module = "org.appliedenergistics:guideme", version.ref = "guideme" }
ae2-fabric = { module = "appeng:appliedenergistics2-fabric", version.ref = "ae2" }
ae2-forge = { module = "appeng:appliedenergistics2-forge", version.ref = "ae2" }

gtceu = { module = "com.gregtechceu.gtceu:gtceu-1.20.1", version.ref = "gtceu" }
mek = { module = "mekanism:Mekanism", version.ref = "mek" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# kotlin-dsl = { id = "org.gradle.kotlin.kotlin-dsl", version.ref = "kotlin-dsl" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
moddev = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddev" }
loom = { id = "fabric-loom", version.ref = "loom" }
